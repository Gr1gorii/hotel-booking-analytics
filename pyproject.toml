[project]
name = "hotel-booking-intelligence"
version = "0.1.0"
description = "Reproducible hotel demand analysis and point-in-time cancellation research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<3", "numpy>=2,<2.4", "scikit-learn>=1.7,<1.9",
  "streamlit>=1.45,<2", "plotly>=6,<7", "pyarrow>=19,<24", "joblib>=1.4,<2"
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotel_booking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
